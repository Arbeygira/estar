<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTAR POS</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-shell">
        <main class="main-content">
            <div class="page-header">
                <h1>Acceso denegado</h1>
            </div>

            <div class="panel access-denied-panel">
                <div class="access-denied-box">
                    <div class="access-denied-icon">🚫</div>
                    <h2>No tienes permisos para acceder a este módulo</h2>
                    <p>Tu rol actual no tiene acceso a esta sección del sistema.</p>
                    <p>Puedes volver al dashboard o cerrar sesión para entrar con otro usuario.</p>
                    <div class="inline-actions">
                        <a href="dashboard.html" class="button-link">Volver al dashboard</a>
                        <a href="#" class="button-link danger" id="logout-link">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        initPage(null).then((ctx) => {
            if (!ctx) return;
            document.getElementById("logout-link").addEventListener("click", (event) => {
                event.preventDefault();
                logout();
            });
        });
    </script>
</body>
</html>
