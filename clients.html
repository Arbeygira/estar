<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTAR POS</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-shell">
        <main class="main-content">
            <div class="page-header">
                <h1>Clientes</h1>
            </div>

            <div class="panel">
                <h2 id="form-title">Registrar cliente</h2>
                <form id="client-form" class="grid-form">
                    <input type="hidden" name="client_id" value="">
                    <div>
                        <label>Nombre</label>
                        <input type="text" name="name" required>
                    </div>
                    <div>
                        <label>Teléfono</label>
                        <input type="text" name="phone">
                    </div>
                    <div>
                        <label>Contacto (celular)</label>
                        <input type="text" name="contact" placeholder="Ej. 3001234567">
                    </div>
                    <div class="full-span">
                        <button type="submit" id="submit-button">Guardar cliente</button>
                        <a class="button-link small-button" href="clients.html" id="cancel-edit" style="display:none;">Cancelar</a>
                    </div>
                </form>
            </div>

            <div class="panel">
                <h2>Listado</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Contacto</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="clients-body">
                        <tr><td colspan="4">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/clients.js"></script>
</body>
</html>
