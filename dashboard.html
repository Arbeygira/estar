<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTAR POS</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-shell">
        <main class="main-content">
            <div class="page-header">
                <h1>Dashboard</h1>
            </div>

            <div class="stats-grid">
                <div class="stat-card green">
                    <span>Total ventas</span>
                    <strong id="stat-sales">COP $0</strong>
                </div>
                <div class="stat-card orange">
                    <span>Encargos</span>
                    <strong id="stat-orders">COP $0</strong>
                </div>
                <div class="stat-card red">
                    <span>Gastos</span>
                    <strong id="stat-expenses">COP $0</strong>
                </div>
                <div class="stat-card blue">
                    <span>Ganancia</span>
                    <strong id="stat-profit">COP $0</strong>
                </div>
                <div class="stat-card purple">
                    <span>Inventario</span>
                    <strong id="stat-products">0</strong>
                </div>
            </div>

            <div class="panel">
                <h2>Resumen</h2>
                <p>Valor del inventario: <span id="inventory-value">COP $0</span></p>
            </div>

            <div class="panel">
                <div class="panel-header-row">
                    <h2>Ventas recientes</h2>
                    <a class="button-link small-button" href="sales.html">Ver todas las ventas</a>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Total</th>
                            <th>Fecha</th>
                            <th>Factura</th>
                        </tr>
                    </thead>
                    <tbody id="recent-sales-body">
                        <tr><td colspan="6">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/dashboard.js"></script>
</body>
</html>
