<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTAR POS</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-shell">
        <main class="main-content">
            <div class="page-header">
                <h1>Gastos</h1>
            </div>

            <div class="panel">
                <h2>Registrar gasto</h2>
                <form id="expense-form" class="grid-form">
                    <div>
                        <label>Descripción</label>
                        <input type="text" name="description" required>
                    </div>
                    <div>
                        <label>Monto</label>
                        <input type="number" step="0.01" min="0" name="amount" value="0" required>
                    </div>
                    <div>
                        <label>Categoría</label>
                        <input type="text" name="category" value="General">
                    </div>
                    <div class="full-span">
                        <button type="submit">Guardar gasto</button>
                    </div>
                </form>
            </div>

            <div class="panel">
                <h2>Historial de gastos</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Descripción</th>
                            <th>Categoría</th>
                            <th>Monto</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-body">
                        <tr><td colspan="5">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/expenses.js"></script>
</body>
</html>
