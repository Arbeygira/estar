<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTAR POS</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-shell">
        <main class="main-content">
            <div class="panel invoice">
                <div class="invoice-header">
                    <div>
                        <p class="invoice-kicker">Comprobante</p>
                        <h1>Factura</h1>
                    </div>
                    <div class="invoice-number-box">
                        <span>Número</span>
                        <strong id="invoice-number">#-</strong>
                    </div>
                </div>

                <div class="invoice-grid">
                    <div class="invoice-card" id="invoice-biller"></div>
                    <div class="invoice-card" id="invoice-client"></div>
                </div>

                <table class="invoice-table">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="invoice-row"></tr>
                    </tbody>
                </table>

                <div class="invoice-summary">
                    <div>
                        <span>Fecha</span>
                        <strong id="invoice-date">-</strong>
                    </div>
                    <div class="invoice-total">
                        <span>Total final</span>
                        <strong id="invoice-total">-</strong>
                    </div>
                </div>

                <div class="invoice-actions">
                    <a class="button-link" href="dashboard.html">Volver</a>
                    <a class="button-link" href="#" id="download-pdf">Descargar PDF</a>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/invoice.js"></script>
</body>
</html>
