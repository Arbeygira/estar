<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTAR POS</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-shell">
        <main class="main-content">
            <div class="panel invoice">
                <div class="invoice-hero">
                    <div class="invoice-hero-copy">
                        <p class="invoice-kicker">Comprobante de venta</p>
                        <h1>Factura</h1>
                        <div class="invoice-meta">
                            <span class="invoice-chip" id="invoice-date">-</span>
                            <span class="invoice-chip">ESTAR POS</span>
                        </div>
                    </div>
                    <div class="invoice-number-box">
                        <span>Factura N°</span>
                        <strong id="invoice-number">#-</strong>
                    </div>
                </div>

                <div class="invoice-grid">
                    <div class="invoice-card" id="invoice-biller"></div>
                    <div class="invoice-card" id="invoice-client"></div>
                </div>

                <div class="table-wrapper">
                    <table class="invoice-table">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Precio</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="invoice-items-body">
                            <tr><td colspan="4">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="invoice-summary">
                    <p class="invoice-note">Gracias por tu compra.</p>
                    <div class="invoice-total">
                        <span>Total a pagar</span>
                        <strong id="invoice-total">-</strong>
                    </div>
                </div>

                <div class="invoice-actions">
                    <a class="button-link btn-ghost" href="sales.html">← Volver</a>
                    <button type="button" class="btn-ghost btn-icon" id="print-invoice" aria-label="Imprimir factura" title="Imprimir">🖨️</button>
                    <a class="button-link" href="#" id="download-pdf">⬇ Descargar PDF</a>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/invoice.js"></script>
</body>
</html>
