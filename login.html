<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTAR POS</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-shell">
        <main class="main-content">
            <div class="topbar-actions">
                <div class="theme-switcher compact" aria-label="Selector de tema">
                    <button type="button" class="theme-toggle" aria-label="Cambiar tema" aria-pressed="true">
                        <span class="theme-toggle-track">
                            <span class="theme-toggle-thumb">
                                <span class="theme-toggle-icon">🌙</span>
                            </span>
                        </span>
                    </button>
                </div>
            </div>
            <div class="messages"></div>
            <div class="login-box">
                <h1>ESTAR</h1>
                <p>Control de ventas, gastos, ganancias y encargos</p>
                <form id="login-form">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required>

                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>

                    <button type="submit">Iniciar sesión</button>
                </form>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/login.js"></script>
</body>
</html>
