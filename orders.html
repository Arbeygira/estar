<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTAR POS</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-shell">
        <main class="main-content">
            <div class="page-header">
                <h1>Encargos</h1>
            </div>

            <div class="panel">
                <h2>Nuevo encargo</h2>
                <form id="order-form" class="grid-form">
                    <div class="client-search-wrap">
                        <label>Cliente</label>
                        <input type="text" name="client_name" class="client-search-input" placeholder="Buscar o seleccionar cliente" autocomplete="off" required>
                        <div class="client-search-options" aria-live="polite"></div>
                    </div>
                    <div>
                        <label>Producto</label>
                        <select name="product_id" id="order-product-select">
                            <option value="">Selecciona un producto</option>
                        </select>
                    </div>
                    <div>
                        <label>Cantidad</label>
                        <input type="number" min="1" name="quantity" id="order-quantity" value="1">
                    </div>
                    <div>
                        <label>Precio unitario</label>
                        <input type="number" step="0.01" min="0" name="unit_price" id="order-unit-price" value="0">
                    </div>
                    <div class="full-span">
                        <button type="button" id="add-order-item" class="small-button">+ Agregar producto</button>
                    </div>
                    <div class="full-span">
                        <ul id="order-items-list" class="order-items-list"></ul>
                    </div>
                    <div>
                        <label>Total</label>
                        <input type="number" step="0.01" min="0" name="total" id="order-total" value="0" readonly>
                    </div>
                    <div>
                        <label>Anticipo</label>
                        <input type="number" step="0.01" min="0" name="deposit" value="0">
                    </div>
                    <div>
                        <label>Pago realizado</label>
                        <input type="number" step="0.01" min="0" name="paid_amount" value="0">
                    </div>
                    <div>
                        <label>Estado</label>
                        <select name="status">
                            <option value="pendiente">Pendiente</option>
                            <option value="en_proceso">En proceso</option>
                            <option value="terminado">Terminado</option>
                            <option value="entregado">Entregado</option>
                            <option value="pagado">Pagado</option>
                        </select>
                    </div>
                    <div>
                        <label>Descripción</label>
                        <input type="text" name="description">
                    </div>
                    <div class="full-span">
                        <button type="submit">Guardar encargo</button>
                    </div>
                </form>
            </div>

            <div class="panel">
                <div class="panel-header-row">
                    <h2>Listado de encargos</h2>
                    <button type="button" id="orders-pdf" class="small-button btn-icon" title="Descargar PDF">📄 PDF</button>
                </div>
                <div class="filter-row">
                    <input type="search" id="order-search" class="table-search" placeholder="Buscar encargo por cliente o producto..." autocomplete="off">
                    <select id="order-status-filter" class="status-filter" aria-label="Filtrar por estado">
                        <option value="activos">Activos</option>
                        <option value="todos">Todos</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="en_proceso">En proceso</option>
                        <option value="terminado">Terminado</option>
                        <option value="entregado">Entregado</option>
                        <option value="pagado">Pagado</option>
                    </select>
                </div>
                <p class="orders-legend">
                    <span><span class="money-badge badge-valor">V</span>Valor</span>
                    <span><span class="money-badge badge-abono">A</span>Abono</span>
                    <span><span class="money-badge badge-pago">P</span>Pago</span>
                </p>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Valor</th>
                            <th>Abono</th>
                            <th>Pago</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body">
                        <tr><td colspan="10">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/orders.js"></script>
</body>
</html>
