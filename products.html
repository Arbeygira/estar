<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTAR POS</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-shell">
        <main class="main-content">
            <div class="page-header">
                <h1>Productos</h1>
            </div>

            <div class="panel">
                <h2 id="form-title">Registrar producto</h2>
                <form id="product-form" class="grid-form">
                    <input type="hidden" name="product_id" value="">
                    <div>
                        <label>Nombre</label>
                        <input type="text" name="name" required>
                    </div>
                    <div id="sku-field" style="display:none;">
                        <label>SKU</label>
                        <input type="text" name="sku" readonly>
                    </div>
                    <div class="full-span" id="sku-hint">
                        <small>El SKU se genera automáticamente al guardar el producto.</small>
                    </div>
                    <div>
                        <label>Stock</label>
                        <input type="number" min="0" name="stock" value="0">
                    </div>
                    <div>
                        <label>Costo</label>
                        <input type="number" step="0.01" min="0" name="cost_price" value="0">
                    </div>
                    <div>
                        <label>Precio de venta</label>
                        <input type="number" step="0.01" min="0" name="price" value="0" required>
                    </div>
                    <div>
                        <label>Categoría</label>
                        <input type="text" name="category" value="General">
                    </div>
                    <div class="full-span">
                        <button type="submit" id="submit-button">Guardar producto</button>
                        <a class="button-link small-button" href="products.html" id="cancel-edit" style="display:none;">Cancelar</a>
                    </div>
                </form>
            </div>

            <div class="panel">
                <h2>Inventario</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>SKU</th>
                            <th>Stock</th>
                            <th>Costo</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="products-body">
                        <tr><td colspan="8">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/products.js"></script>
</body>
</html>
