<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTAR POS</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-shell">
        <main class="main-content">
            <div class="page-header">
                <h1>Ventas</h1>
            </div>

            <div class="panel">
                <h2>Nueva venta</h2>
                <form id="sales-form" class="grid-form">
                    <div>
                        <label>Cliente</label>
                        <select name="client_id" id="client-select">
                            <option value="">Cliente general</option>
                        </select>
                    </div>

                    <div class="full-span product-sale-row">
                        <label>Producto</label>
                        <div class="sale-product-items">
                            <select name="product_ids" class="sale-product-select"></select>
                            <input type="number" min="1" name="quantities" value="1" class="sale-quantity-input" placeholder="Cantidad">
                            <input type="number" step="0.01" min="0" name="unit_prices" value="0" class="sale-price-input" placeholder="Precio">
                            <div class="sale-preview-box">
                                <span>Subtotal</span>
                                <strong id="sale-preview-total">COP $0</strong>
                            </div>
                            <button type="button" class="small-button add-product-item">Agregar</button>
                        </div>
                    </div>

                    <div id="sale-items-container" class="full-span"></div>

                    <div class="full-span sale-summary-box">
                        <strong>Total de la venta:</strong>
                        <span id="sale-total-display">COP $0,00</span>
                    </div>

                    <div class="full-span">
                        <button type="submit">Registrar venta</button>
                    </div>
                </form>
            </div>

            <div class="panel">
                <h2>Historial de ventas</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Total</th>
                            <th>Fecha</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="recent-sales-body">
                        <tr><td colspan="8">Cargando...</td></tr>
                    </tbody>
                </table>
                <div class="pagination">
                    <button type="button" class="small-button" id="sales-prev">← Anterior</button>
                    <span id="sales-page-info" class="pagination-info"></span>
                    <button type="button" class="small-button" id="sales-next">Siguiente →</button>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/sales.js"></script>
</body>
</html>
